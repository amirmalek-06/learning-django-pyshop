{% extends 'base.html' %}

{% block content %}
<h1 class="my-4">Products</h1>
<div class="row row-cols-1 sm:row-cols-2 md:row-cols-3 lg:row-cols-4 xl:row-cols-5 g-3 mb-5">
    {% for product in products %}
    <div class="col">
        <section class="card h-100">
            <img src="{{product.image_url}}" class="card-img-top" alt="{{ product.name }}"
                style="aspect-ratio: 16 / 9; object-fit: cover;">
            <div class="card-body d-flex flex-column">
                <h4 class="card-title mb-2">{{ product.name }}</h4>
                <p class="card-text mt-auto">${{ product.price|floatformat:"2g" }}</p>
                <a href="#" class="btn-solid theme-primary">Add to cart</a>
            </div>
        </section>
    </div>
    {% endfor %}
</div>
{% endblock %}
